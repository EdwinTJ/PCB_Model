
task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']

num_classes: 9
remap_mscoco_category: True

train_dataloader:
  type: DataLoader
  total_batch_size: 8
  dataset:
    type: CocoDetection
    img_folder: /content/DsPCBSD+/Data_COCO/train2017
    ann_file: /content/DsPCBSD+/Data_COCO/annotations/instances_train2017.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 12
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.0
  shuffle: True
  num_workers: 2
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: 1
    stop_epoch: 12
    ema_restart_decay: 0.9998
    mixup_prob: 0.0
    mixup_epochs: [0, 0]

val_dataloader:
  type: DataLoader
  total_batch_size: 8
  dataset:
    type: CocoDetection
    img_folder: /content/DsPCBSD+/Data_COCO/val2017
    ann_file: /content/DsPCBSD+/Data_COCO/annotations/instances_val2017.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  num_workers: 2
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction

model: RTv4
criterion: RTv4Criterion
postprocessor: PostProcessor
use_focal_loss: True
eval_spatial_size: [640, 640]

RTv4:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer

HGNetv2:
  pretrained: False
  local_model_dir: ./pretrain/hgnetv2/
  name: 'B5'
  return_idx: [1, 2, 3]
  freeze_stem_only: True
  freeze_at: -1
  freeze_norm: False

HybridEncoder:
  in_channels: [512, 1024, 2048]
  feat_strides: [8, 16, 32]
  hidden_dim: 384
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 2048
  dropout: 0.0
  enc_act: gelu
  expansion: 1.0
  depth_mult: 1
  act: silu
  distill_teacher_dim: 768

DFINETransformer:
  feat_channels: [384, 384, 384]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_layers: 6
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 8
  layer_scale: 1
  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: default
  activation: silu
  mlp_act: silu

PostProcessor:
  num_top_queries: 300

RTv4Criterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5, loss_mal: 1, loss_distill: 20}
  losses: ['mal', 'boxes', 'local']
  alpha: 0.75
  gamma: 1.5
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
  distill_adaptive_params:
    enabled: True
    rho: 2
    delta: 0.25
    default_weight: 20

# teacher_model disabled (DINOv3 weights not available locally)
# teacher_model:
#   type: "DINOv3TeacherModel"
#   dinov3_repo_path: /content/RT-DETRv4/dinov3/
#   dinov3_weights_path: /content/RT-DETRv4/pretrain/dinov3_vitb16_pretrain_lvd1689m.pth
#   patch_size: 16
#   mean: [0.485, 0.456, 0.406]
#   std: [0.229, 0.224, 0.225]

output_dir: ./outputs/rtv4_hgnetv2_x_pcb

optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00001
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# Faster warmup + shorter training
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 500
flat_epoch: 6
no_aug_epoch: 2
epoches: 12

scaler:
  type: GradScaler
  enabled: True

use_ema: True
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 500
  start: 0

sync_bn: True
find_unused_parameters: False
use_amp: True
clip_max_norm: 0.1
print_freq: 50
checkpoint_freq: 2
